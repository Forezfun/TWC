name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      # Та же основная версия PostgreSQL, что на сервере.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: twc
          POSTGRES_PASSWORD: twc
          POSTGRES_DB: twc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twc -d twc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://twc:twc@127.0.0.1:5432/twc_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --group dev --python 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q
