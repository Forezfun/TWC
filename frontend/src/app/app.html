<div class="app" [class.public-app]="!isAdmin()" [class.admin-app]="isAdmin()">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" routerLink="/sections" aria-label="Колибри, к разделам">
        <img class="brand__art" ngSrc="/kolibri/logo.svg" width="112" height="47" priority alt="" />
      </a>
      @if (!isAdmin()) {
        <div class="header-actions">
          <a class="btn btn--ghost header-icon" routerLink="/intro" aria-label="Как пользоваться" title="Как пользоваться">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>
          </a>
          <a class="btn btn--ghost header-icon" routerLink="/preferences" [queryParams]="{ return: url() }" aria-label="Настройки" title="Настройки">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="white"/><circle cx="16" cy="12" r="2" fill="white"/><circle cx="10" cy="18" r="2" fill="white"/></svg>
          </a>
        </div>
      }
    </div>
  </header>

  <main class="app__main" id="main-content" aria-label="Содержание">
    <router-outlet />
  </main>

  @if (!isAdmin()) {
    <ng-container [ngTemplateOutlet]="supportTemplate()" />
    @if (prefs.sound()) {
    <div class="page-audio" aria-label="Озвучка страницы">
      @if (speech.playing()) {
        <button type="button" class="btn btn--primary" aria-label="Стоп" title="Стоп" (click)="speech.stop()">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1" /></svg>
        </button>
        <button type="button" class="btn btn--secondary" aria-label="Заново" title="Заново" (click)="speech.restart()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4v6h6M4.25 15a8 8 0 1 0 1.9-8.3L3 10" /></svg>
        </button>
      } @else {
        <button type="button" data-page-audio class="btn audio-button" (click)="speech.playPage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" /></svg>
          Прослушать страницу
        </button>
      }
      @if (speech.message()) {
        <p class="audio-message" role="status">{{ speech.message() }} <a routerLink="/preferences" [queryParams]="{ return: url() }">Настройки</a></p>
      }
    </div>
    }
    <div class="public-actions" [class.has-actions]="!!dockTemplate()">
      <ng-container [ngTemplateOutlet]="dockTemplate()" />
    </div>
    <nav class="navbar" aria-label="Навигация">
      <div class="navbar__inner">
        <button type="button" class="btn btn--ghost" (click)="back()" [disabled]="path() === '/' && !nav.backAction()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg>
          Назад
        </button>
        <a class="btn btn--ghost" routerLink="/sections">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
          Домой
        </a>
        <a class="btn btn--ghost" routerLink="/help" [queryParams]="helpLink()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v12H9l-5 3zM8 9h8m-8 4h5"/></svg>
          Помощь
        </a>
      </div>
    </nav>
  }
</div>
