<div class="app">
  <header class="topbar" [class.topbar--wide]="isAdmin()">
    <div class="topbar__inner">
      <a class="brand" routerLink="/" aria-label="На главную">
        <span class="brand__logo" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 12c4-1 7-5 9-9 1 4 4 7 8 8-3 1-5 3-6 6-1-3-4-5-7-5 2-1 3-3 3-5" />
            <path d="M12 21v-6" />
          </svg>
        </span>
        <span>
          <span class="brand__name">Колибри</span><br />
          <span class="brand__sub">Навигатор помощи</span>
        </span>
      </a>
      @if (isAdmin()) {
        <span class="pill">Админка</span>
      } @else {
        <button
          type="button"
          class="btn btn--secondary"
          (click)="toggleSettings()"
          [attr.aria-expanded]="settingsOpen()"
          aria-controls="settings-panel"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
            />
          </svg>
          Настройки
        </button>
      }
    </div>
    @if (settingsOpen() && !isAdmin()) {
      <div id="settings-panel" class="topbar__inner settings">
        <div>
          <p><strong>Размер текста</strong></p>
          <div class="seg" role="group" aria-label="Размер текста">
            @for (s of sizes; track s.key) {
              <button
                type="button"
                class="btn btn--secondary"
                [attr.aria-pressed]="prefs.textSize() === s.key"
                (click)="prefs.textSize.set(s.key)"
              >
                {{ s.label }}
              </button>
            }
          </div>
        </div>
        <div>
          <p><strong>Озвучка текста</strong></p>
          <div class="seg" role="group" aria-label="Озвучка">
            <button
              type="button"
              class="btn btn--secondary"
              [attr.aria-pressed]="prefs.sound()"
              (click)="prefs.sound.set(true)"
            >
              Включена
            </button>
            <button
              type="button"
              class="btn btn--secondary"
              [attr.aria-pressed]="!prefs.sound()"
              (click)="prefs.sound.set(false)"
            >
              Выключена
            </button>
          </div>
          <p class="field__hint">Звук включается только по нажатию кнопки «Прослушать».</p>
        </div>
        <button type="button" class="btn btn--primary" (click)="toggleSettings()">Готово</button>
      </div>
    }
  </header>

  <main class="app__main">
    <router-outlet />
  </main>

  @if (!isHome() && !isAdmin()) {
    <nav class="navbar" aria-label="Навигация по разделам">
      <div class="navbar__inner">
        <button type="button" class="btn btn--secondary" (click)="back()">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M15 6l-6 6 6 6" />
          </svg>
          Назад
        </button>
        <a class="btn btn--secondary" [routerLink]="topicsLink()">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="4" y="4" width="7" height="7" rx="1.5" />
            <rect x="13" y="4" width="7" height="7" rx="1.5" />
            <rect x="4" y="13" width="7" height="7" rx="1.5" />
            <rect x="13" y="13" width="7" height="7" rx="1.5" />
          </svg>
          К темам
        </a>
        <a class="btn btn--secondary" routerLink="/help">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01" />
          </svg>
          Помощь
        </a>
      </div>
    </nav>
  }
</div>
